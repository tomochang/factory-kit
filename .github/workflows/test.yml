# Runs every kit test (tests/run_all.sh) on each push and pull request. No secrets are used.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run all tests
        env:
          CI: "true"
        run: bash tests/run_all.sh
